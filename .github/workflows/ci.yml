name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试
        # conftest 会用 MAS_DATA_DIR 指向临时目录，不会碰 backend/data
        run: python -m pytest -q

      - name: 导入自检
        run: python -c "import app.main; print('backend import OK')"

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npx tsc -b

      - name: 生产构建
        run: npm run build
